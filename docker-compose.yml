# NOVO: banco local para desenvolvimento
services:
  postgres:
    image: postgres:16
    container_name: cadeira-livre-db
    environment:
      POSTGRES_DB: cadeira_livre
      POSTGRES_USER: cadeira
      POSTGRES_PASSWORD: cadeira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
